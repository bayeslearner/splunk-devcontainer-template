name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install splunk-add-on-ucc-framework splunk-appinspect

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find UCC app
        id: find
        run: |
          APP_DIR=$(find apps/ -maxdepth 2 -name "globalConfig.json" -printf "%h\n" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No UCC app found"
            exit 1
          fi
          APP_NAME=$(basename "$APP_DIR")
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: UCC build
        working-directory: ${{ steps.find.outputs.app_dir }}
        run: |
          ucc-gen build --source package --config globalConfig.json --output-dir ../output

      - name: Post-build fixups
        run: |
          APP="output/${{ steps.find.outputs.app_name }}"
          infra/scripts/ucc-fixups.sh "${APP}" "${{ steps.find.outputs.app_dir }}/package/default.d"
          sed -i "s/^version\s*=.*/version = ${{ steps.meta.outputs.version }}/" "${APP}/default/app.conf"

      - name: Run AppInspect
        run: |
          infra/scripts/appinspect.sh "output/${{ steps.find.outputs.app_name }}"

      - name: Package tarball
        run: |
          cd output
          tar czf "${{ steps.find.outputs.app_name }}-${{ steps.meta.outputs.version }}.tgz" "${{ steps.find.outputs.app_name }}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/${{ steps.find.outputs.app_name }}-${{ steps.meta.outputs.version }}.tgz
          generate_release_notes: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find infra/ -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning || true

  ucc-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Find UCC app
        id: find
        run: |
          # Find first directory under apps/ that has a globalConfig.json
          APP_DIR=$(find apps/ -maxdepth 2 -name "globalConfig.json" -printf "%h\n" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No UCC app found — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            APP_NAME=$(basename "$APP_DIR")
            echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
            echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install UCC framework
        if: steps.find.outputs.skip != 'true'
        run: pip install splunk-add-on-ucc-framework

      - name: UCC build
        if: steps.find.outputs.skip != 'true'
        working-directory: ${{ steps.find.outputs.app_dir }}
        run: |
          ucc-gen build --source package --config globalConfig.json --output-dir ../output

      - name: Post-build fixups
        if: steps.find.outputs.skip != 'true'
        run: |
          infra/scripts/ucc-fixups.sh "output/${{ steps.find.outputs.app_name }}" "${{ steps.find.outputs.app_dir }}/package/default.d"

      - name: Install AppInspect
        if: steps.find.outputs.skip != 'true'
        run: pip install splunk-appinspect

      - name: Run AppInspect
        if: steps.find.outputs.skip != 'true'
        run: |
          infra/scripts/appinspect.sh "output/${{ steps.find.outputs.app_name }}"

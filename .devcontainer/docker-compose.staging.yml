# Staging Splunk — separate instance for testing packaged apps.
# Mounts infra/deps/ so tgz files are available at /tmp/apps/.
# The entrypoint auto-discovers and installs them on first start.
# You can also install apps manually via Splunk Web or CLI.
# Runs on different ports so dev and staging can coexist.
# Start with: task splunk:up-staging
# Stop with:  task splunk:down-staging
# Same compose project as the dev file (see its header), so dev and staging of
# one checkout live together and two checkouts stay apart.

name: ${COMPOSE_PROJECT_NAME:-devcontainer}

services:
  splunk-staging:
    platform: linux/amd64
    build:
      context: ../infra
      dockerfile: Dockerfile
      target: dev
      args:
        SPLUNK_VERSION: ${SPLUNK_VERSION:-10.2.1}
    image: ${SPLUNK_IMAGE:-devcontainer-splunk:latest}
    container_name: ${STAGING_CONTAINER_NAME:-splunk-staging}
    hostname: ${STAGING_CONTAINER_NAME:-splunk-staging}
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-admin123}
      ANSIBLE_DEPRECATION_WARNINGS: "false"
      ANSIBLE_SYSTEM_WARNINGS: "false"
      ANSIBLE_ACTION_WARNINGS: "false"
      ANSIBLE_PIPELINING: "true"
      # Emulated amd64 on Apple Silicon has no AVX; the entrypoint wrapper
      # writes this into splunk-launch.conf, which is the only place it works.
      SPLUNK_SKIP_PREINSTALL_CPU_CHECKS_CORRUPTING_DATA_IF_UNSUPPORTED: "1"
    # splunkd opens many files (buckets, sockets); the image's default of 1024
    # is low enough to show up as search and KV Store errors.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${STAGING_WEB_PORT:-18000}:8000"   # Splunk Web (staging)
      - "${STAGING_API_PORT:-18089}:8089"   # splunkd REST API (staging)
      - "${STAGING_HEC_PORT:-18088}:8088"   # HTTP Event Collector (staging)
    volumes:
      # Packaged apps — entrypoint auto-discovers *.tgz and installs on first start
      - ${LOCAL_WORKSPACE_FOLDER:-..}/infra/deps:/tmp/apps
      - splunk-staging-var:/opt/splunk/var
      - splunk-staging-etc:/opt/splunk/etc
    restart: unless-stopped

volumes:
  splunk-staging-var:
  splunk-staging-etc:

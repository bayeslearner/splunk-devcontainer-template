# Runtime services — managed independently from the devcontainer.
# Start with: task splunk:up
# Apps in infra/config/ are bind-mounted to /opt/splunk/dev-apps/ and
# symlinked into /opt/splunk/etc/apps/ by: task app:sync-links
#
# Isolation: the compose project name prefixes the network and every named
# volume, so two checkouts of this template (or two apps built from it) only
# share state when they share COMPOSE_PROJECT_NAME. Without `name:` every
# checkout was project "devcontainer" and all of them shared splunk-var and
# splunk-etc. Set COMPOSE_PROJECT_NAME, DEV_CONTAINER_NAME and SPLUNK_IMAGE in
# .env per checkout; the defaults keep existing checkouts on their old names.

name: ${COMPOSE_PROJECT_NAME:-devcontainer}

services:
  splunk:
    platform: linux/amd64
    build:
      context: ../infra
      dockerfile: Dockerfile
      target: dev
      args:
        SPLUNK_VERSION: ${SPLUNK_VERSION:-10.2.1}
    # Explicit tag so the built image has a known name regardless of the
    # project name; the Taskfile's image guard checks this same tag.
    image: ${SPLUNK_IMAGE:-devcontainer-splunk:latest}
    container_name: ${DEV_CONTAINER_NAME:-splunk-dev}
    hostname: ${DEV_CONTAINER_NAME:-splunk-dev}
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-admin123}
      SPLUNKBASE_USERNAME: ${SPLUNKBASE_USERNAME:-}
      SPLUNKBASE_PASSWORD: ${SPLUNKBASE_PASSWORD:-}
      SPLUNK_APPS_URL: ${SPLUNK_APPS_URL:-}
      # Quiet Ansible (first-run only; skipped on restart)
      ANSIBLE_DEPRECATION_WARNINGS: "false"
      ANSIBLE_SYSTEM_WARNINGS: "false"
      ANSIBLE_ACTION_WARNINGS: "false"
      ANSIBLE_PIPELINING: "true"
      # Emulated amd64 on Apple Silicon has no AVX; the entrypoint wrapper
      # writes this into splunk-launch.conf, which is the only place it works.
      SPLUNK_SKIP_PREINSTALL_CPU_CHECKS_CORRUPTING_DATA_IF_UNSUPPORTED: "1"
    # splunkd opens many files (buckets, sockets); the image's default of 1024
    # is low enough to show up as search and KV Store errors.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Host ports are a shared resource across checkouts; set them per checkout
    # in .env. The Taskfile's port preflight names the container holding one.
    ports:
      - "${SPLUNK_WEB_PORT:-8000}:8000"     # Splunk Web
      - "${SPLUNK_API_PORT:-8089}:8089"     # splunkd REST API
      - "${SPLUNK_HEC_PORT:-8088}:8088"     # HTTP Event Collector
      - "${SPLUNK_DEBUG_PORT:-5678}:5678"   # Python debugpy (SA-VSCode remote debugging)
    volumes:
      # Staging area for tarballs (app:provision installs from here)
      - ${LOCAL_WORKSPACE_FOLDER:-..}/infra/deps:/tmp/apps
      # Persistence — survives container recreation so skip-provision works
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
      # App source directories — symlinked into /opt/splunk/etc/apps/ by app:sync-links
      - ${LOCAL_WORKSPACE_FOLDER:-..}/infra/config:/opt/splunk/dev-apps
      # React source — mounted so stage/ symlinks resolve inside container (react:link)
      - ${LOCAL_WORKSPACE_FOLDER:-..}/react:/opt/splunk/react
      # UCC build output — symlinked into etc/apps/ by ucc:link (same pattern as dev-apps, react)
      - ${LOCAL_WORKSPACE_FOLDER:-..}/output:/opt/splunk/ucc-apps
    restart: unless-stopped

  ## ── Optional sidecars (uncomment as needed) ──────────────────────

  # uf:

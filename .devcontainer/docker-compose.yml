  #   container_name: cribl-edge
  #   ports:
  #     - "9000:9000"
  #     - "9420:9420"

  # postgres:
  #   image: postgres:16-alpine
  #   container_name: splunk-db
  #   environment:
  #     POSTGRES_PASSWORD: dev
  #     POSTGRES_DB: splunkdev
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  splunk-var:
  splunk-etc:
